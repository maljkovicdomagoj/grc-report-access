<!-- EXPRESS CHECKOUT RENDER TEST — paste into an Embed, below the sign-up form.
     Goal: confirm the black Apple Pay button shows up. It does NOT charge yet.

     Apple Pay only renders when ALL of these are true:
       - served over HTTPS on a domain registered in Stripe -> Settings ->
         Payment method domains (grc-report-v-1.webflow.io is registered;
         note: the domain list is SEPARATE per test/live mode)
       - opened in Safari (Mac/iPhone) with a card in Apple Wallet
         (Chrome shows Google Pay instead; localhost/Artifact shows nothing)
     Use your Stripe TEST publishable key below. -->
<div id="express-checkout"></div>
<div id="payment-element" style="margin-top:16px;"></div>
<div id="checkout-msg" style="margin-top:12px;font:14px/1.4 sans-serif;"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const msg = t => { const el = document.getElementById('checkout-msg'); if (el) el.textContent = t; };
  try {
    const stripe = Stripe("pk_test_YOUR_PUBLISHABLE_KEY");

    // Deferred mode: renders the wallet buttons + card form with no server call.
    // Enough to SEE the button. Real subscription/charge is wired in Phase 2.
    const elements = stripe.elements({ mode: 'payment', amount: 2000, currency: 'usd' });

    // Apple Pay button ABOVE the card form, per Apple's guidelines.
    const express = elements.create('expressCheckout', {
      buttonTheme: { applePay: 'black' },
      buttonHeight: 48
    });
    express.mount('#express-checkout');
    elements.create('payment').mount('#payment-element');

    express.on('ready', (e) => {
      const m = e.availablePaymentMethods;
      const avail = m ? Object.keys(m).filter(k => m[k]) : [];
      console.log('availablePaymentMethods', m);
      msg(avail.length
        ? 'Wallet available: ' + avail.join(', ')
        : 'No wallet available — needs Safari + a card in Apple Wallet, on the registered domain.');
    });
    express.on('click', () => msg('Wallet clicked — charging comes in Phase 2.'));
  } catch (err) {
    console.error(err);
    msg('Setup error: ' + err.message + ' — did you replace the publishable key?');
  }
});
</script>
