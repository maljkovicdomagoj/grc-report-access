<!-- EXPRESS CHECKOUT TEST — Apple Pay button + "Pay another way" card fallback.
     Paste into an Embed. Does NOT charge yet (charging = Phase 2 /api).

     Optional plan cards: build 3 cards in Webflow, put on each card
       data-plan  data-amount="3000"   (amount in cents; 3000 = $30.00)
     Clicking a card selects it and updates the total. Style .is-selected yourself.

     Apple Pay only renders on a domain registered in Stripe -> Settings ->
     Payment method domains (separate per test/live). For a device WITHOUT a card
     in Apple Wallet the button is forced on below via applePay:'always' (test only). -->

<div id="express-checkout"></div>
<a href="#" id="pay-another-way" style="display:inline-block;margin-top:12px;">Pay another way</a>
<div id="payment-element" style="display:none;margin-top:16px;"></div>
<div id="checkout-msg" style="margin-top:12px;font:14px/1.4 sans-serif;"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const msg = t => { if ($('checkout-msg')) $('checkout-msg').textContent = t; };
  try {
    const stripe = Stripe("pk_test_YOUR_PUBLISHABLE_KEY");

    // Default = first plan card's amount, or $30 if there are no cards yet.
    const cards = [...document.querySelectorAll('[data-plan]')];
    let amount = cards.length ? +cards[0].dataset.amount : 3000;

    const elements = stripe.elements({ mode: 'payment', amount, currency: 'usd' });

    const express = elements.create('expressCheckout', {
      buttonTheme: { applePay: 'black' },
      buttonHeight: 48,
      paymentMethods: {
        applePay: 'always',   // test: show even without a saved card. Prod: 'auto'
        googlePay: 'auto',
        link: 'never',        // <- removes the Link button
        paypal: 'never',
        amazonPay: 'never'
      }
    });
    express.mount('#express-checkout');

    // Card fallback stays hidden until "Pay another way".
    const payment = elements.create('payment');
    payment.mount('#payment-element');
    $('pay-another-way').addEventListener('click', (e) => {
      e.preventDefault();
      $('payment-element').style.display = 'block';
      e.target.style.display = 'none';
    });

    // Plan cards: select + update the total.
    cards.forEach(card => card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('is-selected'));
      card.classList.add('is-selected');
      amount = +card.dataset.amount;
      elements.update({ amount });   // TODO Phase 2: also remember card.dataset.price for /api
    }));

    express.on('ready', (e) => {
      const m = e.availablePaymentMethods;
      console.log('availablePaymentMethods', m);
      const avail = m ? Object.keys(m).filter(k => m[k]) : [];
      msg(avail.length ? 'Wallet available: ' + avail.join(', ') : 'No wallet buttons available.');
    });
    express.on('click', () => msg('Wallet clicked — charging comes in Phase 2.'));
  } catch (err) {
    console.error(err);
    msg('Setup error: ' + err.message + ' — did you replace the publishable key?');
  }
});
</script>
