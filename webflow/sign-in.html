<!-- Page /access/sign-in — paste into an Embed element on the page.
     Set these IDs on the Webflow inputs/buttons:
       #si-email  #si-password  #si-submit  #si-google
       #si-msg  = an empty text element for status messages -->
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  const msg = t => { const m = $('si-msg'); if (m) m.textContent = t; };

  // Show current login status on page load.
  const { data: { session } } = await window.sb.auth.getSession();
  console.log('session', session);
  msg(session ? 'Logged in as ' + session.user.email : 'Not logged in.');

  $('si-submit')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const { error } = await window.sb.auth.signInWithPassword({
      email: $('si-email').value.trim(),
      password: $('si-password').value
    });
    if (error) return msg(error.message);
    window.location.href = '/dashboard/home';
  });

  $('si-google')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await window.sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/dashboard/home' }
    });
  });
});
</script>
