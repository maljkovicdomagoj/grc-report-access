<!-- SIGN-UP + CHECKOUT (two-step accordion, CARD PATH) — paste into an Embed at
     the bottom of /access/sign-up (or Page Settings → Before </body>).
     No styling here — build the layout in Webflow and give elements these IDs:

     Step 1 (personal info)
       #step1          section wrapper
       #step1-header   clickable header (click = go back to edit)
       #step1-body     the fields wrapper
       #step1-summary  text element shown when collapsed (filled with the email)
       #su-email #su-first #su-last #su-password   inputs
       #err-email #err-first #err-last #err-password   inline error text elements
       #su-next        Next button
     Step 2 (payment)
       #step2          section wrapper (style .is-locked = greyed/disabled)
       #step2-header   clickable header
       #step2-body     wrapper
       #payment-element   empty div (Stripe mounts the card form here)
       #pay-btn        Subscribe button
       #checkout-msg   status/error text element
     Plan term toggle (optional)
       [data-term="month"]  [data-term="year"]   elements (click to switch)

     FILL IN: API_BASE, STRIPE_PK, plan prices/amounts. Order of operations:
     validate + email check on Next; create the account only AFTER payment. -->

<script src="https://js.stripe.com/v3/"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);

  const API_BASE  = "https://grc-report-access.vercel.app".replace(/\/$/, '');
  const STRIPE_PK = "pk_test_51QgwjxGL6M8eL6LJRL0m38bnYqgJTYfk1stTz9HpcsHiRPYUwvdwIl9o1Z6t8c1uWcsOgHLbwsqLdOwg5CnyZHfE00w3KlKFWc";
  const CURRENCY  = 'usd';
  const PLANS = {
    month: { price: 'price_1TrZO4GL6M8eL6LJIDd36JoP', amount: 2900,  label: '$29/month' },
    year:  { price: 'price_1Ts56pGL6M8eL6LJuhmz4Cgd', amount: 27800, label: '$278/year' }
  };

  if (!window.sb) { console.error('Supabase (site-wide code) not loaded'); return; }

  // ---------- plan term (?term=month|year) ----------
  let term = new URLSearchParams(location.search).get('term');
  if (!PLANS[term]) term = 'month';
  let elements;   // set in initCheckout
  function selectTerm(t) {
    if (!PLANS[t]) return;
    term = t;
    document.querySelectorAll('[data-term]').forEach(el =>
      el.classList.toggle('is-selected', el.dataset.term === t));
    if ($('pay-btn')) $('pay-btn').textContent = 'Subscribe · ' + PLANS[t].label;
    if (elements) elements.update({ amount: PLANS[t].amount });
  }
  document.querySelectorAll('[data-term]').forEach(el =>
    el.addEventListener('click', () => selectTerm(el.dataset.term)));
  selectTerm(term);

  // ---------- step 1 validation ----------
  const FIELDS = ['email', 'first', 'last', 'password'];
  const showErr = (f, text) => {
    const e = $('err-' + f); if (!e) return;
    e.textContent = text || ''; e.style.display = text ? 'block' : 'none';
  };
  FIELDS.forEach(f => $('su-' + f)?.addEventListener('input', () => showErr(f, '')));

  async function validateStep1() {
    FIELDS.forEach(f => showErr(f, ''));
    const email = ($('su-email')?.value || '').trim();
    const first = ($('su-first')?.value || '').trim();
    const last  = ($('su-last')?.value || '').trim();
    const pass  = $('su-password')?.value || '';
    let ok = true;
    if (!first) { showErr('first', 'Enter your first name.'); ok = false; }
    if (!last)  { showErr('last', 'Enter your last name.'); ok = false; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr('email', 'Enter a valid email address.'); ok = false; }
    if (pass.length < 8) { showErr('password', 'Password must be at least 8 characters.'); ok = false; }
    if (!ok) return false;
    // email availability (reliable, checks auth.users via RPC)
    const { data: exists, error } = await window.sb.rpc('email_exists', { e: email });
    if (error) { showErr('email', 'Could not verify email, please try again.'); return false; }
    if (exists) { showErr('email', 'This email is already registered — log in instead.'); return false; }
    return true;
  }

  // ---------- accordion ----------
  function openStep2() {
    if ($('step1-body')) $('step1-body').style.display = 'none';
    if ($('step2-body')) $('step2-body').style.display = 'block';
    $('step1')?.classList.add('is-collapsed');
    $('step2')?.classList.remove('is-locked');
    if ($('step1-summary')) {
      $('step1-summary').textContent = ($('su-email')?.value || '').trim();
      $('step1-summary').style.display = 'block';
    }
    initCheckout();
  }
  function openStep1() {
    if ($('step2-body')) $('step2-body').style.display = 'none';
    if ($('step1-body')) $('step1-body').style.display = 'block';
    $('step1')?.classList.remove('is-collapsed');
  }
  $('su-next')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const btn = $('su-next'); btn.disabled = true;
    try { if (await validateStep1()) openStep2(); }
    finally { btn.disabled = false; }
  });
  $('step1-header')?.addEventListener('click', openStep1);            // go back and edit
  $('step2-header')?.addEventListener('click', () => {                // locked until step 1 passes
    if (!$('step2')?.classList.contains('is-locked')) openStep2();
  });

  // ---------- step 2: checkout (card path) ----------
  let stripe, started = false;
  function initCheckout() {
    if (started) return; started = true;
    stripe = Stripe(STRIPE_PK);
    elements = stripe.elements({ mode: 'subscription', amount: PLANS[term].amount, currency: CURRENCY });
    elements.create('payment').mount('#payment-element');
    if ($('pay-btn')) $('pay-btn').textContent = 'Subscribe · ' + PLANS[term].label;
    $('pay-btn')?.addEventListener('click', subscribe);
  }

  async function subscribe() {
    const msg = t => { if ($('checkout-msg')) $('checkout-msg').textContent = t || ''; };
    const btn = $('pay-btn'); if (btn) btn.disabled = true;
    const done = () => { if (btn) btn.disabled = false; };
    msg('Processing…');

    const { error: submitError } = await elements.submit();
    if (submitError) { msg(submitError.message); return done(); }

    const email = ($('su-email')?.value || '').trim();
    const password = $('su-password')?.value || '';
    const first = ($('su-first')?.value || '').trim();
    const last  = ($('su-last')?.value || '').trim();

    // 1. Stripe customer + incomplete subscription
    const res = await fetch(API_BASE + '/api/create-subscription', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, firstName: first, lastName: last, priceId: PLANS[term].price })
    });
    const data = await res.json();
    if (!res.ok) { msg(data.error || 'Could not start checkout.'); return done(); }

    // 2. Confirm payment. redirect:'if_required' so we stay on the page to create
    //    the account after success (test cards don't 3-D Secure).
    const { error: payError } = await stripe.confirmPayment({
      elements,
      clientSecret: data.clientSecret,
      redirect: 'if_required',
      confirmParams: { return_url: window.location.origin + '/dashboard/home' }
    });
    if (payError) { msg(payError.message); return done(); }

    // 3. Payment succeeded -> create the Supabase account now (email confirmation OFF).
    const { error: signErr } = await window.sb.auth.signUp({
      email, password, options: { data: { first_name: first, last_name: last } }
    });
    if (signErr) {
      console.error('signUp after successful payment failed:', signErr);
      msg('Payment succeeded but we could not create your account (' + signErr.message +
          '). You have been charged — please contact support with your email.');
      return done();
    }

    // 4. Done — trigger links the subscription to the new user by email.
    window.location.href = '/dashboard/home';
  }
});
</script>
