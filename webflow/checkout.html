<!-- SIGN-UP + CHECKOUT — single page (v2 flow). Paste into ONE Embed on
     /access/sign-up. Renders the whole form, so remove any manually-built fields.

     Order: pick plan → enter details → pay (Apple Pay if available, else card).
     Email is validated as it's entered (format + availability). The Supabase
     account is created only AFTER a successful payment.

     FILL IN: API_BASE, STRIPE_PK, plan prices/amounts. -->

<style>
.acc { width: 480px; max-width: 100%; margin: 0 auto; }
.acc h2 { font-size:22px; font-weight:700; margin:0 0 16px; }
.section-label { font-weight:600; font-size:15px; margin:18px 0 10px; }
.section-label:first-of-type { margin-top:0; }

.signup-input { height:3rem; width:100%; padding:14px 16px !important; border:1px solid #E0E0E0 !important;
  border-radius:8px !important; font-size:16px !important; font-family:inherit; outline:none;
  margin-bottom:12px; box-sizing:border-box; }
.signup-input:focus { border-color:#333 !important; }
.password-wrapper { position:relative; margin-bottom:12px; }
.password-wrapper .signup-input { padding-right:60px !important; margin-bottom:0; }
.password-toggle { position:absolute; right:16px; top:50%; transform:translateY(-50%);
  cursor:pointer; font-size:14px; color:#666; user-select:none; }
.password-toggle:hover { color:#333; }
.terms-row { display:flex; align-items:center; gap:8px; font-size:14px; margin:4px 0 14px; font-weight:400; }
.terms-link { font-weight:700; color:inherit; }
.terms-checkbox { -webkit-appearance:none; appearance:none; width:18px; height:18px; border:1px solid #E0E0E0;
  border-radius:4px; cursor:pointer; flex-shrink:0; position:relative; background:white; }
.terms-checkbox:checked { background-color:#E8503A; border-color:#E8503A; }
.terms-checkbox:checked::after { content:''; position:absolute; left:5px; top:2px; width:5px; height:9px;
  border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg); }

.plan-row { display:flex; gap:8px; margin-bottom:14px; }
.plan-opt { position:relative; flex:1; border:1px solid #E0E0E0; border-radius:8px; padding:12px; cursor:pointer; }
.plan-opt.is-selected { border-color:#E8503A; box-shadow:0 0 0 1px #E8503A inset; }
.plan-name { font-weight:600; font-size:14px; }
.plan-price { font-size:18px; font-weight:700; margin-top:2px; }
.plan-price span { font-size:12px; font-weight:400; color:#666; }
.plan-save { position:absolute; top:8px; right:8px; background:#2E7D32; color:#fff;
  font-size:11px; font-weight:600; padding:2px 6px; border-radius:6px; }

.access-btn { width:100%; padding:14px 20px; color:#fff; border:none; border-radius:12px;
  background-color:#E8503A; font-size:15px; font-weight:500; cursor:pointer; margin-top:8px; }
.access-btn[disabled] { opacity:.6; cursor:default; }
#pay-another-way { display:block; width:100%; height:48px; line-height:48px; text-align:center;
  background:#f0f0f0; color:#333; border-radius:8px; text-decoration:none; font-size:15px;
  font-weight:500; margin:12px 0; cursor:pointer; }
#pay-another-way:hover { background:#e6e6e6; }
#pay-btn { padding-top:10px; padding-bottom:10px; }
#payment-element { margin-top:14px; }
.input-error { border-color:#E8503A !important; }
.field-err { color:#E8503A; font-size:13px; margin:-6px 0 10px; display:none; }
.secure-note { display:flex; align-items:center; justify-content:center; gap:6px;
  margin-top:12px; font-size:13px; line-height:1.3; color:#888; }
.secure-note svg { flex-shrink:0; }
#checkout-msg { margin-top:12px; font:14px/1.4 inherit; }
#checkout-msg.is-error { color:#E8503A; }

@media (max-width: 520px) {
  .acc { width:100%; }
  .acc h2 { font-size:20px; }
  .plan-row { flex-direction:column; }
  .signup-input { font-size:16px !important; }
}
</style>

<div class="acc">
  <h2>Sign up</h2>

  <div class="section-label">Choose your membership</div>
  <div class="plan-row">
    <div class="plan-opt is-selected" data-plan="monthly">
      <div class="plan-name">Monthly</div>
      <div class="plan-price">$29<span>/month</span></div>
    </div>
    <div class="plan-opt" data-plan="yearly">
      <span class="plan-save">Save 20%</span>
      <div class="plan-name">Annual</div>
      <div class="plan-price">$23<span>/month</span></div>
    </div>
  </div>

  <div class="section-label">Your details</div>
  <input id="su-email" class="signup-input" type="email" placeholder="Email" autocomplete="email">
  <div class="field-err" id="err-email"></div>
  <input id="su-first" class="signup-input" placeholder="First name" autocomplete="given-name">
  <div class="field-err" id="err-first"></div>
  <input id="su-last" class="signup-input" placeholder="Last name" autocomplete="family-name">
  <div class="field-err" id="err-last"></div>
  <div class="password-wrapper">
    <input id="su-password" class="signup-input" type="password" placeholder="Password" autocomplete="new-password">
    <span class="password-toggle">Show</span>
  </div>
  <div class="field-err" id="err-password"></div>
  <label class="terms-row"><input id="su-terms" type="checkbox" class="terms-checkbox"> <span>I agree to the <a class="terms-link" href="https://grcreport.com/terms-of-service" target="_blank" rel="noopener">terms</a></span></label>
  <div class="field-err" id="err-terms"></div>

  <div class="section-label">Payment</div>
  <div id="express-checkout"></div>
  <a href="#" id="pay-another-way">Pay with card</a>
  <div id="payment-element" style="display:none;"></div>
  <button id="pay-btn" type="button" class="access-btn" style="display:none;">Subscribe</button>
  <div class="secure-note">
    <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="#888"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#888" stroke-width="2"/></svg>
    Secure checkout — payments are processed by Stripe.
  </div>

  <div id="checkout-msg"></div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const msg = (t, isError) => { const m = $('checkout-msg'); if (!m) return;
    m.textContent = t || ''; m.classList.toggle('is-error', !!isError); };

  const API_BASE  = "https://grc-report-access.vercel.app".replace(/\/$/, '');
  const STRIPE_PK = "pk_test_51QgwjxGL6M8eL6LJRL0m38bnYqgJTYfk1stTz9HpcsHiRPYUwvdwIl9o1Z6t8c1uWcsOgHLbwsqLdOwg5CnyZHfE00w3KlKFWc";
  const CURRENCY  = 'usd';
  const PLANS = {
    monthly: { price: 'price_1TrZO4GL6M8eL6LJIDd36JoP', amount: 2900 },
    yearly:  { price: 'price_1Ts56pGL6M8eL6LJuhmz4Cgd', amount: 27800 }
  };
  const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  if (!window.sb) return msg('Supabase not loaded — is the site-wide code on this page?', true);

  const mark = (el, bad) => el && el.classList.toggle('input-error', bad);
  const fieldErr = (name, text) => {
    const e = $('err-' + name); if (!e) return;
    e.textContent = text || ''; e.style.display = text ? 'block' : 'none';
  };

  // Password show/hide.
  document.querySelector('.password-toggle')?.addEventListener('click', function () {
    const i = $('su-password'); const hidden = i.type === 'password';
    i.type = hidden ? 'text' : 'password'; this.textContent = hidden ? 'Hide' : 'Show';
  });

  // ---- validation ----
  // Email is validated as it's entered (format + availability via RPC).
  let emailState = { value: '', ok: false };
  async function checkEmail() {
    const email = $('su-email').value.trim();
    fieldErr('email', ''); mark($('su-email'), false);
    if (!email) { emailState = { value: email, ok: false }; return false; }
    if (!EMAIL_RE.test(email)) { emailState = { value: email, ok: false }; fieldErr('email', 'Enter a valid email address.'); mark($('su-email'), true); return false; }
    const { data: exists, error } = await window.sb.rpc('email_exists', { e: email });
    if (error) { emailState = { value: email, ok: false }; fieldErr('email', 'Could not verify email, please try again.'); return false; }
    if (exists) { emailState = { value: email, ok: false }; fieldErr('email', 'This email is already registered — log in instead.'); mark($('su-email'), true); return false; }
    emailState = { value: email, ok: true }; return true;
  }
  $('su-email').addEventListener('blur', checkEmail);
  $('su-email').addEventListener('input', () => {
    fieldErr('email', ''); mark($('su-email'), false);
    emailState = { value: $('su-email').value.trim(), ok: false };
  });
  ['su-first', 'su-last', 'su-password'].forEach(id =>
    $(id).addEventListener('input', () => { mark($(id), false); fieldErr(id.replace('su-', ''), ''); }));
  $('su-terms').addEventListener('change', () => fieldErr('terms', ''));

  function validateOther() {
    const first = $('su-first').value.trim(), last = $('su-last').value.trim(),
          pass = $('su-password').value, terms = $('su-terms').checked;
    ['first', 'last', 'password', 'terms'].forEach(n => fieldErr(n, ''));
    let ok = true;
    if (!first) { fieldErr('first', 'Enter your first name.'); mark($('su-first'), true); ok = false; }
    if (!last)  { fieldErr('last', 'Enter your last name.'); mark($('su-last'), true); ok = false; }
    if (!pass) { fieldErr('password', 'Enter a password.'); mark($('su-password'), true); ok = false; }
    else if (pass.length < 8) { fieldErr('password', 'Password must be at least 8 characters.'); mark($('su-password'), true); ok = false; }
    if (!terms) { fieldErr('terms', 'Please accept the terms to continue.'); ok = false; }
    return ok;
  }
  // Sync gate for the Apple Pay button (relies on the on-blur email check).
  function gateSync() {
    const email = $('su-email').value.trim();
    let ok = validateOther();
    if (!email) { fieldErr('email', 'Enter your email.'); mark($('su-email'), true); ok = false; }
    else if (!EMAIL_RE.test(email)) { fieldErr('email', 'Enter a valid email address.'); mark($('su-email'), true); ok = false; }
    else if (!(emailState.ok && emailState.value === email)) { checkEmail(); ok = false; }
    return ok;
  }
  // Authoritative async check before charging.
  async function validateAll() {
    const e = await checkEmail();
    const o = validateOther();
    return e && o;
  }

  // ---- checkout ----
  let selected = PLANS.monthly;
  const stripe = Stripe(STRIPE_PK);
  const elements = stripe.elements({ mode: 'subscription', amount: selected.amount, currency: CURRENCY });
  const express = elements.create('expressCheckout', {
    buttonTheme: { applePay: 'black' }, buttonHeight: 48,
    paymentMethods: { applePay: 'auto', googlePay: 'auto', link: 'never', paypal: 'never', amazonPay: 'never' }
  });
  express.mount('#express-checkout');
  elements.create('payment').mount('#payment-element');

  const showCard = () => { $('payment-element').style.display = 'block';
    $('pay-btn').style.display = 'block'; $('pay-another-way').style.display = 'none'; };
  express.on('ready', (e) => {
    const m = e.availablePaymentMethods;
    if (!(m && Object.values(m).some(Boolean))) { $('express-checkout').style.display = 'none'; showCard(); }
  });
  $('pay-another-way').addEventListener('click', (e) => { e.preventDefault(); showCard(); });

  document.querySelectorAll('.plan-opt').forEach(opt => opt.addEventListener('click', () => {
    const plan = PLANS[opt.dataset.plan]; if (!plan) return;
    selected = plan;
    document.querySelectorAll('.plan-opt').forEach(o => o.classList.remove('is-selected'));
    opt.classList.add('is-selected');
    elements.update({ amount: selected.amount });
  }));

  // Apple Pay: only open the wallet sheet if the form is valid.
  express.on('click', (ev) => { if (gateSync()) ev.resolve(); });
  express.on('confirm', subscribe);
  $('pay-btn').addEventListener('click', subscribe);

  async function subscribe() {
    const btn = $('pay-btn'); if (btn) btn.disabled = true;
    const done = () => { if (btn) btn.disabled = false; };

    if (!(await validateAll())) return done();
    msg('Processing…');

    const { error: submitError } = await elements.submit();
    if (submitError) { msg(''); return done(); }   // Stripe shows the field error inline already

    const email = $('su-email').value.trim();
    const password = $('su-password').value;
    const first = $('su-first').value.trim();
    const last  = $('su-last').value.trim();

    const res = await fetch(API_BASE + '/api/create-subscription', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, firstName: first, lastName: last, priceId: selected.price })
    });
    const data = await res.json();
    if (!res.ok) { msg(data.error || 'Could not start checkout.', true); return done(); }

    const { error: payError } = await stripe.confirmPayment({
      elements, clientSecret: data.clientSecret, redirect: 'if_required',
      confirmParams: { return_url: window.location.origin + '/dashboard/home' }
    });
    if (payError) { msg(payError.message, true); return done(); }

    const { error: signErr } = await window.sb.auth.signUp({
      email, password, options: { data: { first_name: first, last_name: last } }
    });
    if (signErr) {
      console.error('signUp after payment failed:', signErr);
      msg('Payment succeeded but we could not create your account (' + signErr.message +
          '). You have been charged — please contact support.', true);
      return done();
    }
    window.location.href = '/dashboard/home';
  }
});
</script>
