<!-- SIGN-UP + CHECKOUT (single embed, two-step, v2) — paste into ONE Embed on
     /access/sign-up. Replaces the separate styling embed AND the checkout embed.

     Order of operations: Next only validates + checks email availability.
     The Supabase account is created AFTER a successful payment (no orphaned
     accounts). Works for card AND Apple Pay (both use the step-1 email/password).

     Webflow elements this expects:
       inputs:   #su-first  #su-last  #su-email  #su-password   (class .signup-input)
       terms:    #su-terms   (checkbox, class .terms-checkbox)
       toggle:   an element with class .password-toggle (Show/Hide)
       next:     #su-next    ("Next" / "Continue")
     Plan cards (optional): add data-plan="monthly" / data-plan="yearly".
     FILL IN: API_BASE, STRIPE_PK, plan amounts (cents). -->

<style>
.signup-input {
  height: 3rem;
  width: 100%;
  padding: 14px 16px !important;
  border: 1px solid #E0E0E0 !important;
  border-radius: 8px !important;
  font-size: 16px !important;
  font-family: inherit;
  outline: none;
  margin-bottom: 12px;
  box-sizing: border-box;
}
.signup-input:focus { border-color: #333 !important; }
.password-wrapper { position: relative; margin-bottom: 12px; }
.password-wrapper .signup-input { padding-right: 60px !important; margin-bottom: 0; }
.password-toggle {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  cursor: pointer; font-size: 14px; color: #666; user-select: none;
}
.password-toggle:hover { color: #333; }
.terms-checkbox {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border: 1px solid #E0E0E0; border-radius: 4px;
  cursor: pointer; flex-shrink: 0; position: relative; background: white;
}
.terms-checkbox:checked { background-color: #E8503A; border-color: #E8503A; }
.terms-checkbox:checked::after {
  content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px;
  border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
/* invalid field highlight */
.input-error { border-color: #E8503A !important; }
#checkout-msg.is-error { color: #E8503A; }
/* Subscribe button reset — visual identity comes from .access-btn */
#pay-btn { padding: 14px 20px; width: 100%; color: #fff; border: none; cursor: pointer; }
</style>

<div id="checkout-step" style="display:none;margin-top:16px;">
  <div id="express-checkout"></div>
  <a href="#" id="pay-another-way" style="display:inline-block;margin-top:12px;">Pay with card</a>
  <div id="payment-element" style="display:none;margin-top:16px;"></div>
  <button id="pay-btn" type="button" class="access-btn" style="display:none;margin-top:12px;">Subscribe</button>
</div>
<div id="checkout-msg" style="margin-top:12px;font:14px/1.4 sans-serif;"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const msg = (t, isError) => {
    const m = $('checkout-msg'); if (!m) return;
    m.textContent = t; m.classList.toggle('is-error', !!isError);
  };

  const API_BASE  = "https://grc-report-access.vercel.app".replace(/\/$/, '');
  const STRIPE_PK = "pk_test_51QgwjxGL6M8eL6LJRL0m38bnYqgJTYfk1stTz9HpcsHiRPYUwvdwIl9o1Z6t8c1uWcsOgHLbwsqLdOwg5CnyZHfE00w3KlKFWc";
  const CURRENCY  = 'usd';
  const PLANS = {
    monthly: { price: 'price_1TrZO4GL6M8eL6LJIDd36JoP', amount: 2900 },
    yearly:  { price: 'price_1Ts56pGL6M8eL6LJuhmz4Cgd', amount: 27800 }
  };

  if (!window.sb) return msg('Supabase not loaded — is the site-wide code on this page?', true);
  $('su-password')?.closest('form')?.addEventListener('submit', (e) => e.preventDefault());

  // Password show/hide toggle.
  document.querySelector('.password-toggle')?.addEventListener('click', function () {
    const input = $('su-password'); if (!input) return;
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? 'Hide' : 'Show';
  });

  // Clear the red highlight as soon as the user fixes a field.
  const mark = (el, bad) => el && el.classList.toggle('input-error', bad);
  ['su-first', 'su-last', 'su-email', 'su-password'].forEach(id =>
    $(id)?.addEventListener('input', () => mark($(id), false)));
  $('su-terms')?.addEventListener('change', () => mark($('su-terms'), false));

  async function validateAccount() {
    const first = $('su-first'), last = $('su-last'), email = $('su-email'),
          pass = $('su-password'), terms = $('su-terms');
    let ok = true, message = '';
    [first, last, email, pass].forEach(el => {
      const empty = !el || !el.value.trim();
      mark(el, empty);
      if (empty) ok = false;
    });
    if (email?.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) {
      mark(email, true); ok = false; message ||= 'Enter a valid email address.';
    }
    if (pass?.value && pass.value.length < 8) {
      mark(pass, true); ok = false; message ||= 'Password must be at least 8 characters.';
    }
    if (terms && !terms.checked) {
      mark(terms, true); ok = false; message ||= 'Please accept the terms to continue.';
    }
    if (!ok) { msg(message || 'Please fill in all required fields.', true); return false; }

    // Email availability (reliable, checks auth.users via RPC) — before payment.
    const { data: exists, error } = await window.sb.rpc('email_exists', { e: email.value.trim() });
    if (error) { msg('Could not verify email, please try again.', true); return false; }
    if (exists) { mark(email, true); msg('This email is already registered — log in instead.', true); return false; }
    return true;
  }

  // ---- Step 1: validate only, then reveal checkout (NO account yet) ----
  async function goToCheckout() {
    const btn = $('su-next'); if (btn) btn.disabled = true;
    try {
      if (!(await validateAccount())) return;
      msg('');
      $('checkout-step').style.display = 'block';
      if (btn) btn.style.display = 'none';
      initCheckout();   // mount Stripe now that the container is visible
    } finally { if (btn) btn.disabled = false; }
  }
  $('su-next')?.addEventListener('click', (e) => { e.preventDefault(); goToCheckout(); });

  // ---- Step 2: checkout (init once) ----
  let started = false;
  function initCheckout() {
    if (started) return; started = true;
    const stripe = Stripe(STRIPE_PK);
    const cards = [...document.querySelectorAll('[data-plan]')];
    let selected = PLANS[cards[0]?.dataset.plan] || PLANS.monthly;

    const elements = stripe.elements({ mode: 'subscription', amount: selected.amount, currency: CURRENCY });
    const express = elements.create('expressCheckout', {
      buttonTheme: { applePay: 'black' }, buttonHeight: 48,
      paymentMethods: { applePay: 'auto', googlePay: 'auto', link: 'never', paypal: 'never', amazonPay: 'never' }
    });
    express.mount('#express-checkout');
    elements.create('payment').mount('#payment-element');

    const showCard = () => {
      $('payment-element').style.display = 'block';
      $('pay-btn').style.display = 'inline-block';
      $('pay-another-way').style.display = 'none';
    };

    // No Apple Pay / Google Pay on this device -> show the card form straight away.
    express.on('ready', (e) => {
      const m = e.availablePaymentMethods;
      const hasWallet = m && Object.values(m).some(Boolean);
      if (!hasWallet) { $('express-checkout').style.display = 'none'; showCard(); }
    });
    $('pay-another-way').addEventListener('click', (e) => { e.preventDefault(); showCard(); });

    cards.forEach(card => card.addEventListener('click', () => {
      const plan = PLANS[card.dataset.plan];
      if (!plan) return;
      selected = plan;
      cards.forEach(c => c.classList.remove('is-selected'));
      card.classList.add('is-selected');
      elements.update({ amount: selected.amount });
    }));

    async function subscribe() {
      msg('Processing…');
      const btn = $('pay-btn'); if (btn) btn.disabled = true;
      const done = () => { if (btn) btn.disabled = false; };

      const { error: submitError } = await elements.submit();
      if (submitError) { msg(submitError.message, true); return done(); }

      const email = $('su-email').value.trim();
      const password = $('su-password').value;
      const first = $('su-first')?.value.trim();
      const last  = $('su-last')?.value.trim();

      // 1. Stripe customer + incomplete subscription (no account yet).
      const res = await fetch(API_BASE + '/api/create-subscription', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email, firstName: first, lastName: last, priceId: selected.price })
      });
      const data = await res.json();
      if (!res.ok) { msg(data.error || 'Could not start checkout.', true); return done(); }

      // 2. Confirm payment. redirect:'if_required' keeps us here to create the
      //    account after success (Apple Pay uses the step-1 email, not the wallet's).
      const { error: payError } = await stripe.confirmPayment({
        elements,
        clientSecret: data.clientSecret,
        redirect: 'if_required',
        confirmParams: { return_url: window.location.origin + '/dashboard/home' }
      });
      if (payError) { msg(payError.message, true); return done(); }

      // 3. Payment OK -> create the Supabase account now (email confirmation OFF).
      const { error: signErr } = await window.sb.auth.signUp({
        email, password, options: { data: { first_name: first, last_name: last } }
      });
      if (signErr) {
        console.error('signUp after successful payment failed:', signErr);
        msg('Payment succeeded but we could not create your account (' + signErr.message +
            '). You have been charged — please contact support with your email.', true);
        return done();
      }

      // 4. Done — the new-user trigger links the subscription by email.
      window.location.href = '/dashboard/home';
    }

    express.on('confirm', subscribe);
    $('pay-btn').addEventListener('click', subscribe);
  }
});
</script>
